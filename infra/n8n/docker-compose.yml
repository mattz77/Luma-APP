services:
  n8n-db:
    image: postgres:15.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - ./volumes/n8n-db:/var/lib/postgresql/data
    networks:
      - n8n-db-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:1.72.0
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      # URLs
      WEBHOOK_URL: https://n8n.luma.nicebyte.ia.br
      N8N_HOST: n8n.luma.nicebyte.ia.br
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      # Encryption
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Auth (required — CF Access is layer 1, basic auth is layer 2)
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_AUTH_PASSWORD}
      # Hardening
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # HMAC secret — must match EXPO_PUBLIC_N8N_HMAC_SECRET in luma-app
      N8N_HMAC_SECRET: ${N8N_HMAC_SECRET}
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Pruning (keep 7 days of exec history)
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - ./volumes/n8n-data:/home/node/.n8n
    networks:
      - luma-net
      - n8n-db-net
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.luma.nicebyte.ia.br`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.middlewares=cloudflare-only@file,rate-limit-webhook@file,security-headers@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

networks:
  luma-net:
    external: true
  n8n-db-net:
    driver: bridge
    internal: true

# Azure Pipelines -- Luma APP
#
# Pre-requisitos no Azure DevOps (Project Settings -> Library -> Variable Groups):
#
#   Variable group: "luma-secrets"
#     EXPO_TOKEN                    EAS access token (expo.dev/accounts/nicebytesolutions/settings/access-tokens)
#     EXPO_PUBLIC_SUPABASE_URL      https://luma-api.nicebyte.ia.br
#     EXPO_PUBLIC_SUPABASE_ANON_KEY <self-hosted anon JWT>
#     EXPO_PUBLIC_N8N_WEBHOOK_URL   https://luma-n8n.nicebyte.ia.br
#     EXPO_PUBLIC_N8N_HMAC_SECRET   <hmac secret from infra/supabase/.env>
#     EXPO_PUBLIC_N8N_JWT_SECRET    <jwt secret from infra/supabase/.env>
#
#   Variable group: "luma-rls-test-secrets"  (used only in validate stage)
#     RLS_TEST_SUPABASE_URL         https://luma-api.nicebyte.ia.br
#     RLS_TEST_SUPABASE_ANON_KEY    <self-hosted anon JWT>
#     RLS_TEST_USER_A_EMAIL         <test user A email>
#     RLS_TEST_USER_A_PASSWORD      <test user A password>
#     RLS_TEST_USER_B_EMAIL         <test user B email>
#     RLS_TEST_USER_B_PASSWORD      <test user B password>
#     RLS_TEST_HOUSE_A_ID           <house A UUID>
#     RLS_TEST_HOUSE_B_ID           <house B UUID>
#
# Estrategia:
#   validate       -- typecheck + Jest + RLS tests (todo PR e push)
#   eas_update     -- OTA push para branch production (push em main, mudancas em luma-app/)
#   build_preview  -- EAS build preview Android (PRs e develop)
#   build_production -- EAS build completo (main, apenas quando versao/deps nativas mudarem)

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - luma-app/**
      - azure-pipelines.yml

pr:
  branches:
    include:
      - main
      - develop

variables:
  - group: luma-secrets
  - name: BUN_VERSION
    value: '1.1.34'
  - name: NODE_VERSION
    value: '20.x'
  - name: WORKDIR
    value: 'luma-app'
  - name: EAS_ACCOUNT
    value: 'nicebytesolutions'
  - name: EAS_PROJECT
    value: 'luma-app'

# ─────────────────────────────────────────────────────────────────────────────
stages:

  - stage: validate
    displayName: 'Validate (typecheck + tests + RLS)'
    jobs:
      - job: validate_job
        displayName: 'Lint, types, unit tests'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
            displayName: 'Setup Node $(NODE_VERSION)'

          - bash: |
              curl -fsSL https://bun.sh/install | bash -s "bun-v$(BUN_VERSION)"
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun $(BUN_VERSION)'

          - bash: |
              cd $(WORKDIR)
              bun install --frozen-lockfile || bun install
            displayName: 'Install deps'

          - bash: |
              cd $(WORKDIR)
              bun run typecheck
            displayName: 'TypeScript typecheck'
            continueOnError: false

          - bash: |
              cd $(WORKDIR)
              bun run test:ci
            displayName: 'Jest unit tests'
            env:
              CI: 'true'

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '$(WORKDIR)/test-results/jest-junit.xml'
              testRunTitle: 'Jest unit'
              failTaskOnFailedTests: true

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: '$(WORKDIR)/coverage/lcov.info'

      - job: rls_tests
        displayName: 'RLS integration tests'
        pool:
          vmImage: 'ubuntu-latest'
        condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
        variables:
          - group: luma-rls-test-secrets
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - bash: |
              curl -fsSL https://bun.sh/install | bash -s "bun-v$(BUN_VERSION)"
              echo "##vso[task.prependpath]$HOME/.bun/bin"
            displayName: 'Install Bun'

          - bash: |
              cd $(WORKDIR)
              bun install --frozen-lockfile || bun install
            displayName: 'Install deps'

          - bash: |
              cd $(WORKDIR)
              bun run test:rls
            displayName: 'RLS tests (self-hosted Supabase)'
            env:
              RLS_TEST_SUPABASE_URL: $(RLS_TEST_SUPABASE_URL)
              RLS_TEST_SUPABASE_ANON_KEY: $(RLS_TEST_SUPABASE_ANON_KEY)
              RLS_TEST_USER_A_EMAIL: $(RLS_TEST_USER_A_EMAIL)
              RLS_TEST_USER_A_PASSWORD: $(RLS_TEST_USER_A_PASSWORD)
              RLS_TEST_USER_B_EMAIL: $(RLS_TEST_USER_B_EMAIL)
              RLS_TEST_USER_B_PASSWORD: $(RLS_TEST_USER_B_PASSWORD)
              RLS_TEST_HOUSE_A_ID: $(RLS_TEST_HOUSE_A_ID)
              RLS_TEST_HOUSE_B_ID: $(RLS_TEST_HOUSE_B_ID)

  # ─────────────────────────────────────────────────────────────────────────
  - stage: eas_update
    displayName: 'EAS Update (OTA -> production)'
    dependsOn: validate
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: ota_push
        displayName: 'eas update --branch production'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - bash: |
              npm install -g eas-cli@latest
            displayName: 'Install eas-cli'

          - bash: |
              cd $(WORKDIR)
              npm install --no-audit --no-fund
            displayName: 'Install deps'

          - bash: |
              cd $(WORKDIR)
              eas update \
                --branch production \
                --message "Azure CI: $(Build.SourceVersionMessage)" \
                --non-interactive
            displayName: 'EAS OTA update'
            env:
              EXPO_TOKEN: $(EXPO_TOKEN)
              EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
              EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
              EXPO_PUBLIC_N8N_WEBHOOK_URL: $(EXPO_PUBLIC_N8N_WEBHOOK_URL)
              EXPO_PUBLIC_N8N_HMAC_SECRET: $(EXPO_PUBLIC_N8N_HMAC_SECRET)
              EXPO_PUBLIC_N8N_JWT_SECRET: $(EXPO_PUBLIC_N8N_JWT_SECRET)

  # ─────────────────────────────────────────────────────────────────────────
  - stage: build_preview
    displayName: 'EAS Build (preview)'
    dependsOn: validate
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], 'refs/heads/develop')
        )
      )
    jobs:
      - job: eas_preview
        displayName: 'eas build --profile preview (Android APK)'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - bash: |
              npm install -g eas-cli@latest
            displayName: 'Install eas-cli'

          - bash: |
              cd $(WORKDIR)
              npm install --no-audit --no-fund
            displayName: 'Install deps'

          - bash: |
              cd $(WORKDIR)
              eas build \
                --platform android \
                --profile preview \
                --non-interactive \
                --no-wait
            displayName: 'EAS build Android preview'
            env:
              EXPO_TOKEN: $(EXPO_TOKEN)
              EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
              EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
              EXPO_PUBLIC_N8N_WEBHOOK_URL: $(EXPO_PUBLIC_N8N_WEBHOOK_URL)
              EXPO_PUBLIC_N8N_HMAC_SECRET: $(EXPO_PUBLIC_N8N_HMAC_SECRET)
              EXPO_PUBLIC_N8N_JWT_SECRET: $(EXPO_PUBLIC_N8N_JWT_SECRET)

  # ─────────────────────────────────────────────────────────────────────────
  - stage: build_production
    displayName: 'EAS Build (production — native changes only)'
    dependsOn: validate
    # Only run when app version bumped or native deps changed
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    jobs:
      - job: check_native_changes
        displayName: 'Detect native dependency changes'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - bash: |
              CHANGED=$(git diff HEAD~1 --name-only \
                luma-app/app.json \
                luma-app/package.json \
                luma-app/android/ \
                luma-app/ios/ \
                luma-app/eas.json 2>/dev/null | head -1)
              if [ -n "$CHANGED" ]; then
                echo "##vso[task.setvariable variable=NATIVE_CHANGED;isOutput=true]true"
                echo "Native changes detected: $CHANGED"
              else
                echo "##vso[task.setvariable variable=NATIVE_CHANGED;isOutput=true]false"
                echo "No native changes -- skipping full build"
              fi
            name: detect
            displayName: 'Check for native changes'

      - job: eas_production
        displayName: 'eas build --profile production (Android + iOS)'
        dependsOn: check_native_changes
        condition: |
          eq(dependencies.check_native_changes.outputs['detect.NATIVE_CHANGED'], 'true')
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)

          - bash: |
              npm install -g eas-cli@latest
            displayName: 'Install eas-cli'

          - bash: |
              cd $(WORKDIR)
              npm install --no-audit --no-fund
            displayName: 'Install deps'

          - bash: |
              cd $(WORKDIR)
              eas build \
                --platform all \
                --profile production \
                --non-interactive \
                --no-wait
            displayName: 'EAS build production (all platforms)'
            env:
              EXPO_TOKEN: $(EXPO_TOKEN)
              EXPO_PUBLIC_SUPABASE_URL: $(EXPO_PUBLIC_SUPABASE_URL)
              EXPO_PUBLIC_SUPABASE_ANON_KEY: $(EXPO_PUBLIC_SUPABASE_ANON_KEY)
              EXPO_PUBLIC_N8N_WEBHOOK_URL: $(EXPO_PUBLIC_N8N_WEBHOOK_URL)
              EXPO_PUBLIC_N8N_HMAC_SECRET: $(EXPO_PUBLIC_N8N_HMAC_SECRET)
              EXPO_PUBLIC_N8N_JWT_SECRET: $(EXPO_PUBLIC_N8N_JWT_SECRET)
